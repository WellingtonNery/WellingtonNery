<svg width="1600" height="500" viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0908"/>
      <stop offset="55%" stop-color="#130E0D"/>
      <stop offset="100%" stop-color="#0B100E"/>
    </linearGradient>

    <linearGradient id="neonMix" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A1B27"/>
      <stop offset="100%" stop-color="#B3283D"/>
    </linearGradient>

    <linearGradient id="wedgeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B3283D" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#B3283D" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="wedgeBlue" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7A1B27" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7A1B27" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#EDE9E3" opacity="0.045"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1600" height="500" fill="url(#bgGrad)"/>
  <rect width="1600" height="500" fill="url(#scanlines)">
    <animate attributeName="opacity" values="1;0.55;1;0.8;1;0.5;1" keyTimes="0;0.1;0.22;0.36;0.5;0.71;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- VHS tracking bands -->
  <rect x="0" y="-60" width="1600" height="46" fill="#EDE9E3" opacity="0.05">
    <animate attributeName="y" values="-60;560" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="560" width="1600" height="12" fill="#B3283D" opacity="0.07">
    <animate attributeName="y" values="560;-12" dur="5.2s" repeatCount="indefinite"/>
  </rect>

  <!-- hard-edged angular accents -->
  <polygon points="1600,0 1600,260 1180,0" fill="url(#wedgeRed)"/>
  <polygon points="0,500 0,260 380,500" fill="url(#wedgeBlue)"/>

  <!-- corner HUD brackets -->
  <g stroke="#B3283D" stroke-width="2" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.3s" repeatCount="indefinite"/>
    <polyline points="24,60 24,24 60,24" fill="none"/>
    <polyline points="1540,24 1576,24 1576,60" fill="none"/>
    <polyline points="24,440 24,476 60,476" fill="none"/>
    <polyline points="1576,440 1576,476 1540,476" fill="none"/>
  </g>

  <!-- ============ LEFT: identity ============ -->

  <!-- role tag -->
  <rect x="90" y="66" width="430" height="46" rx="2" fill="#FFFFFF" fill-opacity="0.03" stroke="#B3283D" stroke-opacity="0.55" stroke-width="1.4"/>
  <text x="112" y="95" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#D9D4CC">Software Engineering Student</text>
  <line x1="400" y1="78" x2="400" y2="100" stroke="#6B665F" stroke-opacity="0.6" stroke-width="1"/>
  <text x="418" y="95" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#C97D84">PUCPR</text>

  <!-- name with glitch offset slices -->
  <text x="91" y="220" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="-1.5" fill="#B3283D" opacity="0.55"><animateTransform attributeName="transform" type="translate" values="0,0;0,0;4,-2;-3,1;0,0;0,0;0,0" keyTimes="0;0.55;0.57;0.6;0.63;0.9;1" dur="4.6s" repeatCount="indefinite"/>Wellington Nery</text>
  <text x="85" y="224" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="-1.5" fill="#EDE9E3" opacity="0.45"><animateTransform attributeName="transform" type="translate" values="0,0;0,0;-3,2;4,-1;0,0;0,0;0,0" keyTimes="0;0.6;0.62;0.65;0.68;0.9;1" dur="3.9s" repeatCount="indefinite"/>Wellington Nery</text>
  <text x="88" y="222" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="-1.5" fill="#EDE9E3">Wellington Nery</text>

  <!-- straight rail under surname -->
  <line x1="612" y1="244" x2="812" y2="244" stroke="url(#neonMix)" stroke-width="3" filter="url(#glow)"/>
  <rect x="608" y="240" width="8" height="8" fill="#7A1B27"/>
  <rect x="808" y="240" width="8" height="8" fill="#B3283D"/>

  <!-- terminal-style tagline -->
  <text x="90" y="292" font-family="'Consolas', 'Menlo', monospace" font-size="22" fill="#D9D4CC"><tspan fill="#B3283D">&gt;</tspan> I build structures that hold - in code and beyond<tspan fill="#D9D4CC" opacity="0.8">_<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>

  <!-- tags -->
  <g font-family="'Consolas', 'Menlo', monospace" font-size="17">
    <rect x="90" y="380" width="280" height="42" rx="2" fill="none" stroke="#7A1B27" stroke-opacity="0.6" stroke-width="1.3"/>
    <text x="106" y="406" fill="#D9D4CC">#software-architecture</text>

    <rect x="384" y="380" width="310" height="42" rx="2" fill="none" stroke="#B3283D" stroke-opacity="0.55" stroke-width="1.3"/>
    <text x="400" y="406" fill="#C97D84">#interactive-storytelling</text>

    <rect x="708" y="380" width="270" height="42" rx="2" fill="none" stroke="#D9D4CC" stroke-opacity="0.3" stroke-width="1.3"/>
    <text x="724" y="406" fill="#D9D4CC">#software-development</text>
  </g>

  <!-- location as a terminal line -->
  <text x="90" y="462" font-family="'Consolas', 'Menlo', monospace" font-size="15" fill="#8A8480"><tspan fill="#B3283D">$</tspan> Curitiba, Brazil - open to remote work</text>

  <!-- ============ RIGHT: terminal + circuit routing ============ -->

  <path d="M 1010 40 L 1010 20 L 1560 20" fill="none" stroke="#B3283D" stroke-width="1.2" opacity="0.2"/>

  <!-- terminal window -->
  <rect x="990" y="55" width="540" height="225" rx="4" fill="#0F0C0C" stroke="#33302C" stroke-width="1.4"/>
  <path d="M 990 55 L 1530 55 L 1530 89 L 990 89 Z" fill="#1A1512"/>
  <rect x="1014" y="66" width="14" height="14" fill="#B3283D"/>
  <rect x="1036" y="66" width="14" height="14" fill="#7A1B27"/>
  <rect x="1058" y="66" width="14" height="14" fill="#C97D84"/>
  <text x="1086" y="77" font-family="'Consolas', 'Menlo', monospace" font-size="14" fill="#8A8480">soul.js</text>

  <g font-family="'Consolas', 'Menlo', monospace" font-size="19">
    <text x="1014" y="122"><tspan fill="#B3283D" font-weight="700">const</tspan><tspan fill="#EDE9E3"> soul = {</tspan></text>
    <text x="1038" y="152"><tspan fill="#C7C2BC">root</tspan><tspan fill="#8A8480">: </tspan><tspan fill="#D9505F">"poetry"</tspan><tspan fill="#8A8480">,</tspan></text>
    <text x="1038" y="182"><tspan fill="#C7C2BC">branches</tspan><tspan fill="#8A8480">: [</tspan><tspan fill="#D9505F">"code","games","music"</tspan><tspan fill="#8A8480">],</tspan></text>
    <text x="1038" y="212"><tspan fill="#C7C2BC">growing</tspan><tspan fill="#8A8480">: </tspan><tspan fill="#C97D84">true</tspan></text>
    <text x="1014" y="242"><tspan fill="#EDE9E3">};</tspan></text>
  </g>

  <!-- PCB-style routing -->
  <path d="M 1014 280 L 1014 322 L 1130 322 L 1130 370 L 1300 370 L 1300 424 L 1462 424"
        fill="none" stroke="url(#neonMix)" stroke-width="2.5" filter="url(#glow)"/>
  <rect x="1008" y="316" width="12" height="12" fill="#7A1B27"/>
  <rect x="1124" y="316" width="12" height="12" fill="#B3283D"/>
  <rect x="1124" y="364" width="12" height="12" fill="#7A1B27"/>
  <rect x="1294" y="364" width="12" height="12" fill="#B3283D"/>
  <rect x="1294" y="418" width="12" height="12" fill="#7A1B27"/>
  <rect x="1454" y="416" width="18" height="18" fill="none" stroke="#B3283D" stroke-width="2" filter="url(#glow)"/>

  <!-- REC indicator -->
  <circle cx="1452" cy="35" r="5" fill="#B3283D">
    <animate attributeName="opacity" values="1;1;0.15;1" keyTimes="0;0.5;0.62;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="1465" y="40" font-family="'Consolas', 'Menlo', monospace" font-size="13" letter-spacing="1" fill="#D9D4CC">REC</text>
  <text x="1465" y="56" font-family="'Consolas', 'Menlo', monospace" font-size="11" fill="#8A8480">00:19:07</text>

  <!-- bottom brand strip -->
  <rect x="0" y="496" width="1600" height="4" fill="url(#neonMix)" opacity="0.85"/>
</svg>
